name: "🚧 Enforce Integration Branch"

on:
  # `edited` also fires when the PR base branch is changed, so retargeting
  # a PR re-runs this check.
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: enforce-base-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enforce-base:
    name: "🚧 Enforce Integration Branch"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify PR targets the integration branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Self-retiring guard: while `integration/staging` exists the repo is
          # in batch mode and every PR must target it instead of `main`.
          # Once that branch is merged and deleted, this workflow passes for
          # everyone and can be removed at any time.
          INTEGRATION_BRANCH="integration/staging"

          # Query the branch reference including HTTP headers to inspect the exact status code
          set +e
          api_output=$(gh api -i "repos/${GITHUB_REPOSITORY}/git/ref/heads/${INTEGRATION_BRANCH}" 2>&1)
          api_exit=$?
          set -e

          # Parse HTTP status from response header (e.g. "HTTP/2.0 404 Not Found" or "HTTP/1.1 200 OK")
          http_status=$(printf '%s\n' "$api_output" | grep -m1 -E '^HTTP/[0-9.]+[[:space:]]+[0-9]{3}' | awk '{print $2}' || true)

          # Pass ONLY when the branch genuinely does not exist (HTTP 404).
          # Any other failure (rate limit, 5xx, invalid token) must fail closed.
          if [ "$http_status" = "404" ] || { [ "$api_exit" -ne 0 ] && printf '%s' "$api_output" | grep -q "HTTP 404"; }; then
            echo "Batch mode over: '${INTEGRATION_BRANCH}' does not exist (HTTP 404). Passing."
            exit 0
          elif [ "$http_status" = "200" ] || [ "$api_exit" -eq 0 ]; then
            echo "Integration branch '${INTEGRATION_BRANCH}' exists (HTTP 200). Batch mode active."
          else
            echo "::error title=GitHub API error::Failed to verify existence of branch '${INTEGRATION_BRANCH}'. API returned exit code ${api_exit}, HTTP status '${http_status:-unknown}'. Failing closed to avoid bypassing batch mode guard."
            printf '%s\n' "$api_output"
            exit 1
          fi

          if [ "${HEAD_REF}" = "${INTEGRATION_BRANCH}" ]; then
            echo "PR #${PR_NUMBER} is the integration branch itself merging. Passing."
            exit 0
          fi

          if [ "${BASE_REF}" = "main" ]; then
            echo "::error title=Wrong base branch::PR #${PR_NUMBER} targets 'main'. Batch mode is active - retarget this PR to '${INTEGRATION_BRANCH}'."
            exit 1
          fi

          echo "OK: PR #${PR_NUMBER} targets '${BASE_REF}' (batch mode active)."
