rule_files:
  - prometheus-alerts.yml

evaluation_interval: 1m

tests:
  # ── Test OphirPayWebhookHighFailureRate ──────────────────────────
  - interval: 1m
    input_series:
      - series: 'ophirpay_delivery_final_outcomes_total{delivery_type="webhook",final_outcome="failure"}'
        values: '0+10x15'
      - series: 'ophirpay_delivery_final_outcomes_total{delivery_type="webhook",final_outcome="success"}'
        values: '0+10x15'
    alert_rule_test:
      - eval_time: 6m
        alertname: OphirPayWebhookHighFailureRate
        exp_alerts:
          - exp_labels:
              severity: warning
              component: webhooks
            exp_annotations:
              summary: "Webhook delivery failure rate > 5%"
              description: "50% of webhook deliveries have failed\nover a 5-minute window. Inspect subscriber health, response codes, and delivery queue.\n"
              runbook_url: "https://github.com/OphirPay/OphirPay/blob/main/docs/TROUBLESHOOTING.md#webhook-high-failure-rate"

  # ── Test OphirPayRpcProviderDegraded ───────────────────────────
  - interval: 1m
    input_series:
      - series: 'ophirpay_rpc_requests_total{status_class="5xx"}'
        values: '0+10x10'
      - series: 'ophirpay_rpc_requests_total{status_class="2xx"}'
        values: '0+10x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: OphirPayRpcProviderDegraded
        exp_alerts:
          - exp_labels:
              severity: critical
              component: rpc
            exp_annotations:
              summary: "Soroban RPC provider latency > 2.5s or returning 5xx errors"
              description: "Soroban RPC provider is degraded for at least 3 minutes (p95 latency > 2.5s\nor 5xx server errors). Investigate upstream RPC provider health and failover state.\n"
              runbook_url: "https://github.com/OphirPay/OphirPay/blob/main/docs/TROUBLESHOOTING.md#soroban-rpc-provider-degraded"

  # ── Test OphirPayDatabasePoolExhaustion ─────────────────────────
  - interval: 1m
    input_series:
      - series: 'ophirpay_database_pool_wait_seconds'
        values: '0.8+0x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: OphirPayDatabasePoolExhaustion
        exp_alerts:
          - exp_labels:
              severity: critical
              component: database
            exp_annotations:
              summary: "Prisma connection pool queue wait > 500ms"
              description: "Prisma database connection pool queue wait time is 0.8s (> 500ms).\nThe pool is exhausted and queries are queuing. Check slow queries and connection limits.\n"
              runbook_url: "https://github.com/OphirPay/OphirPay/blob/main/docs/TROUBLESHOOTING.md#database-connection-pool-exhaustion"
